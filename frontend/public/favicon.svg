<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#d4a853" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e" />
      <stop offset="100%" stop-color="#0a0a12" />
    </linearGradient>
  </defs>
  
  <!-- Outer Hexagon Chamber -->
  <polygon points="32,2 58,17 58,47 32,62 6,47 6,17" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linejoin="round" />
  
  <!-- Inner Hexagon Ring -->
  <polygon points="32,8 52,20 52,44 32,56 12,44 12,20" stroke="#d4a853" stroke-opacity="0.35" stroke-width="1.2" stroke-dasharray="3 2" />
  
  <!-- Open Book Symbol in Gold -->
  <g transform="translate(18, 20) scale(1.15)">
    <!-- Left page -->
    <path d="M12 4 C8 2.5 3 3 1 4.5 V19 C3 17.5 8 17 12 18.5 Z" fill="#d4a853" fill-opacity="0.85" stroke="#fef3c7" stroke-width="0.8" />
    <!-- Right page -->
    <path d="M12 4 C16 2.5 21 3 23 4.5 V19 C21 17.5 16 17 12 18.5 Z" fill="#f59e0b" fill-opacity="0.9" stroke="#fef3c7" stroke-width="0.8" />
    <!-- Spine -->
    <line x1="12" y1="4" x2="12" y2="18.5" stroke="#78350f" stroke-width="1.2" />
    <!-- Page text lines simulation -->
    <line x1="4" y1="8" x2="9" y2="7.5" stroke="#0a0a12" stroke-width="0.8" stroke-linecap="round" />
    <line x1="4" y1="11" x2="9" y2="10.5" stroke="#0a0a12" stroke-width="0.8" stroke-linecap="round" />
    <line x1="4" y1="14" x2="8" y2="13.5" stroke="#0a0a12" stroke-width="0.8" stroke-linecap="round" />
    <line x1="15" y1="7.5" x2="20" y2="8" stroke="#0a0a12" stroke-width="0.8" stroke-linecap="round" />
    <line x1="15" y1="10.5" x2="20" y2="11" stroke="#0a0a12" stroke-width="0.8" stroke-linecap="round" />
    <line x1="16" y1="13.5" x2="20" y2="14" stroke="#0a0a12" stroke-width="0.8" stroke-linecap="round" />
  </g>
</svg>